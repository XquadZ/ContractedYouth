  title: 위약금·손해배상 예정
  match_keywords:
  - 위약금
  - 손해배상
  - 배상액 예정
  - 위약
  safe:
  - 불이행에 대한 위약금·손해배상액 예정 조항이 없음
  violation:
  - 계약 불이행 시 위약금·배상액을 미리 정함
  check_if:
