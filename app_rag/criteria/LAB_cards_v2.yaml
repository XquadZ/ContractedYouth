  - 국민연금
  - 건강보험
  - 4대보험
  safe:
  - 4대보험 적용 여부를 항목별로 표시
  - 근로자인데 전액 개인 부담·미가입을 강제하지 않음
  violation:
  - 근로자임에도 사회보험 미가입을 전제로 함
  - 위장 프리랜서로 보험을 회피
  check_if:
  - 가입 대상·부담 비율이 계약만으로 불명
  needs_facts:
