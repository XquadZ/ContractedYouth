- id: LAB-TERM
  title: 계약기간
  match_keywords:
  - 계약기간
  - 근로개시일
  - 기간의 정함
  - 근로계약기간
  - 만료
  safe:
  - 무기한은 개시일만, 기간제는 시작·종료일이 모두 있고 모순 없음
  violation:
  - 기간제인데 종료일 공란으로 기간을 확정할 수 없음
  check_if:
  - ‘필요 시 연장’만 있고 연장 절차·통지 시점이 없음 → 실제 통지 관행
  - 날짜가 없는 날이거나 앞뒤가 바뀜 → 실제 시작·종료일
  needs_facts:
  - 계약_유형
  basis:
  - law:근로기준법:17
- id: LAB-PLACE
  title: 근무장소
  match_keywords:
  - 근무장소
  - 근무지
  - 사업장
  - 취업의 장소
  - 전근
  - 배치전환
  safe:
  - 구체적 주소·점포명이 있고, 변경 시 사전 협의 또는 합의를 적음
  violation: []
  check_if:
  - ‘본사 및 지정 사업장’처럼 범위만 있음 → 실제 배치 범위
  - 사용자가 일방적으로 근무지를 바꿀 수 있다고만 적음 → 변경 범위·업무상 필요·근로자 불이익·협의 절차
  needs_facts: []
  basis:
  - law:근로기준법:17
  - decree:근로기준법 시행령:8
- id: LAB-DUTY
  title: 업무 내용
  match_keywords:
  - 업무
  - 직무
  - 직종
  - 담당업무
  - 업무의 내용
  safe:
  - 담당 업무·직종이 구체적으로 적혀 있고 일방 추가 권한이 없음
  violation: []
  check_if:
  - ‘기타 지시 업무’만 있음 → 실제 범위가 통상 업무인지
  - 사용자가 업무를 언제든 추가·변경할 수 있다고만 적음 → 변경 범위·업무상 필요·근로자 불이익·협의 절차
  needs_facts: []
  basis:
  - law:근로기준법:17
  - decree:근로기준법 시행령:8
- id: LAB-REST
  title: 근로시간·휴게
  match_keywords:
  - 휴게
  - 근로시간
  - 근무시간
  - 소정근로
  - 시업
  - 종업
  safe:
  - 4시간에 30분 이상·8시간에 1시간 이상 휴게를 근무 도중에 줌
  - 1일 8시간·1주 40시간 이내 명시
  violation:
  - 휴게 없음·기준 미달
  - 휴게를 근무 종료 후에만 줌
  - 1일 8시간·1주 40시간 초과를 상시로 정함(상시 5명 이상)
  check_if:
  - ‘한가할 때 휴게’만 있음 → 실제로 쉴 수 있는지
  - 대기시간이 근로시간인지
  needs_facts:
  - 일_근로시간
  - 주_근로시간
  - 상시근로자수
  basis:
  - law:근로기준법:54
  missing_basis:
  - law:근로기준법:50
- id: LAB-HOLIDAY
  title: 휴일·주휴
  match_keywords:
  - 주휴
  - 유급휴일
  - 휴일
  - 주휴일
  - 공휴일
  safe:
  - 1주 평균 1회 이상 유급휴일(주휴)을 명시
  - 초단시간(주 15시간 미만)이면 주휴 비적용을 명시
  violation:
  - 주휴를 주지 않거나 무조건 무급으로 정함(주 15시간 이상인데)
  check_if:
  - 주 소정근로시간이 15시간 이상인지 불명
  - 개근 요건만 있고 요일 미정
  - 주휴수당을 시급에 포함한다고만 적음 → 주휴수당 금액이 구분돼 있고 이를 빼도 최저임금 이상인지
  needs_facts:
  - 주_소정근로시간
  basis:
  - law:근로기준법:55
  - decree:근로기준법 시행령:30
  - law:근로기준법:18
- id: LAB-WAGE
  title: 임금(구성·계산·지급)
  match_keywords:
  - 임금
  - 급여
  - 시급
  - 월급
  - 지급일
  - 지급방법
  - 구성항목
  safe:
  - 구성·계산·지급방법·지급일이 있고, 통화·직접·전액·매월 1회 이상 일정일 지급
  violation:
  - 임의 공제
  - 직접 지급 배제
  - 지급일 없음
  - 통화 외 지급을 원칙으로 함(법령·협약 근거 없음)
  check_if:
  - 공제 항목이 있으나 법령·협약 근거가 안 보임
  needs_facts: []
  basis:
  - law:근로기준법:17
  - law:근로기준법:43
- id: LAB-MINWAGE
  title: 최저임금
  match_keywords:
  - 최저임금
  - 시급
  - 시간급
  - 최저
  safe:
  - 시간급이 계약 기간에 해당하는 연도의 최저임금(config/min_wage.yaml) 이상
  - 수습 감액은 1년↑계약·3개월 이내·단순노무 제외·10% 이내
  violation:
  - 최저임금 미달
  - 수습 감액 요건을 깨고 감액
  check_if:
  - 월급만 있고 시간환산 불가 → 소정근로시간 확인
  - 수습·단순노무 여부 불명
  needs_facts:
  - 시급_또는_월급
  - 소정근로시간
  - 수습여부
  - 계약기간_1년이상
  - 단순노무여부
  - 적용연도
  basis:
  - law:최저임금법:5
  - law:최저임금법:6:1
  - law:최저임금법:6:3
  - decree:최저임금법 시행령:3
  - notice:최저임금고시:2026
- id: LAB-PROBATION
  title: 수습
  match_keywords:
  - 수습
  - 시용
  - 수습기간
  - 수습 중
  safe:
  - 수습 기간·처우가 명확하고, 감액 시 최저임금법 제5조·시행령 제3조 요건을 충족
  violation:
  - 수습이라는 이유로 최저임금 미만·10% 초과 감액
  - 1년 미만 계약에 감액
  check_if:
  - 수습 후 본계약 전환 기준이 모호
  needs_facts:
  - 수습여부
  - 계약기간_1년이상
  - 단순노무여부
  basis:
  - law:최저임금법:5
  - decree:최저임금법 시행령:3
- id: LAB-OT
  title: 연장·야간·휴일 가산
  match_keywords:
  - 연장
  - 야간
  - 휴일근로
  - 가산
  - 시간외
  - 연장근로
  safe:
  - 연장·야간·휴일근로에 법정 가산(50% 이상)을 지급한다고 적거나, 가산을 배제하는 문구가 없음
  violation:
  - 연장·야간·휴일 가산을 지급하지 않거나 포괄로 배제
  check_if:
  - 포괄임금제만 있고 내역·할증이 안 보임 → 실제 산정
  - 5인 미만 여부
  needs_facts:
  - 상시근로자수
  basis:
  - law:근로기준법:56
- id: LAB-PT-OT
  title: 단시간 초과근로 가산
  match_keywords:
  - 단시간
  - 초과근로
  - 소정근로 초과
  - 가산임금률
  safe:
  - 단시간 근로자가 약정 시간을 넘기면 법정시간 내라도 50% 이상 가산
  violation:
  - 단시간 초과근로 가산을 배제·미지급으로 정함
  check_if:
  - 단시간인지(통상근로자 대비 짧은 소정근로) 불명
  - 상시 5명 미만 여부
  needs_facts:
  - 단시간여부
  - 약정_소정근로
  - 상시근로자수
  basis:
  - law:근로기준법:18
  missing_basis:
  - 기간제법 제6조 제3항
- id: LAB-ANNUAL
  title: 연차유급휴가
  match_keywords:
  - 연차
  - 유급휴가
  - 연차유급휴가
  - 휴가 포기
  safe:
  - 근로기준법 제60조에 따라 부여한다고 명시
  - 사전 포기 약정 없음
  violation:
  - 연차를 주지 않음
  - 미리 연차 전부를 포기한다고 정함
  check_if:
  - 주 15시간 미만(초단시간)인지
  - 5인 미만인지
  needs_facts:
  - 주_소정근로시간
  - 상시근로자수
  basis:
  - law:근로기준법:60:1
  - law:근로기준법:60:2
  - law:근로기준법:18
- id: LAB-INSURE
  title: 사회보험
