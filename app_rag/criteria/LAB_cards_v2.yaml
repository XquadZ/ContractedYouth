  basis: []
  missing_basis:
  - 고용보험법
  - 국민연금법
  - 건강보험법
  - 산업재해보상보험법
- id: LAB-DELIVER
  title: 계약서 교부
  match_keywords:
  - 교부
  - 사본
  - 서면
  - 계약서 교부
  - 교부요구
  safe:
  - 체결 시 근로자 요구와 관계없이 서면(전자문서 포함) 교부
  violation:
  - 요구할 때만 준다
  - 교부하지 않는다고 정함
  check_if:
  - 전자계약만 언급 → 실제 교부 여부
  needs_facts: []
  basis:
  - law:근로기준법:17
- id: LAB-DISMISS
  title: 해고 예고
  match_keywords:
  - 해고
  - 해고예고
  - 해고 예고
  - 즉시해고
  - 권고사직
  safe:
  - 해고 시 30일 전 예고 또는 30일분 이상 통상임금(예외 사유는 법에 따름)
  violation:
  - 예고·예고수당 없이 언제든 해고 가능하다고 정함
  check_if:
  - 계속근로 3개월 미만 등 예외 해당 여부
  needs_facts:
  - 계속근로기간
  basis:
  - law:근로기준법:26
  - law:근로기준법:23
- id: LAB-SEVERANCE
  title: 퇴직금
  match_keywords:
  - 퇴직금
  - 퇴직급여
  - DC
  - DB
  - IRP
  safe:
  - 퇴직급여 제도를 법에 따라 적용한다고 하거나 포기를 강요하지 않음
  violation:
  - 임금에 퇴직금 포함으로 지급 면제
  - 퇴직금 사전 포기
  check_if:
  - 계속근로 1년 미만·주 15시간 미만 여부
