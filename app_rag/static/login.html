<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>로그인 · (계)약한청년들</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #101f3d;
      --blue: #3967ff;
      --ink: #172743;
      --muted: #748099;
      --line: #e7ebf2;
      --pale: #f5f7fc;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
      font-size: 15px;
      letter-spacing: -.5px;
      background: var(--pale);
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .shell {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
    }
    .hero-pane {
      background: radial-gradient(ellipse at 88% 100%, #213f7c 0, transparent 57%), var(--navy);
      color: #fff;
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: #9bb5ff;
      margin: 0;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 64px;
      height: 58px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1.6px;
      line-height: 1.2;
      margin: 0;
    }
    .brand-blue { color: #9fb8ff; }
    .hero-lead {
      margin: 4px 0 0;
      color: #b4c0d6;
      line-height: 1.85;
      font-size: 15px;
      max-width: 420px;
    }
    .hero-points {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .hero-points li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: #d4dded;
      font-size: 13px;
      line-height: 1.6;
    }
    .hero-points li::before {
      content: "✧";
      color: #9bb5ff;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .form-pane {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 36px;
      background: var(--pale);
    }
    .form-links-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .form-links-top a:hover { color: var(--blue); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(16, 31, 61, .06);
      padding: 28px 26px 24px;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      padding: 4px;
      background: #eef2f8;
      border-radius: 10px;
    }
    .tabs button {
      margin: 0;
      padding: 11px 10px;
      border-radius: 8px;
      background: transparent;
      color: #5b6b84;
      font-weight: 700;
      font-size: 14px;
    }
    .tabs button.on {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    }
    .field { margin-top: 14px; }
    .field:first-of-type { margin-top: 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #44536d;
      margin-bottom: 6px;
    }
    .control {
      position: relative;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cfd6e4;
      border-radius: 8px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
    }
    input:focus {
      outline: 3px solid #6e9aff55;
      border-color: #8eabff;
    }
    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      color: #6d7c94;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 8px;
    }
    .field-error {
      min-height: 1.1em;
      margin-top: 6px;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }
    .age-note {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .primary {
      margin-top: 18px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }
    .primary:hover { filter: brightness(1.05); }
    .form-links-bottom {
      margin: 16px auto 0;
      max-width: 440px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .form-links-bottom a {
      color: #5b6f95;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .hero-pane {
        padding: 28px 22px 22px;
        gap: 10px;
      }
      .brand-logo { width: 44px; height: 40px; }
      .brand-name { font-size: 24px; }
      .hero-lead { font-size: 13px; max-width: none; }
      .hero-points { display: none; }
      .form-pane { padding: 18px 16px 36px; }
      .card { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="hero-pane" aria-label="브랜드 소개">
      <p class="hero-eyebrow">처음 계약하는 2030을 위한</p>
      <div class="brand-row">
        <img class="brand-logo" src="/static/icons/icon-192.png" alt="(계)약한청년들 로고" />
        <h1 class="brand-name"><span class="brand-blue">(계)</span>약한청년들</h1>
      </div>
      <p class="hero-lead">원본과 근거를 나란히, 놓치기 쉬운 조항까지 꼼꼼하게.</p>
      <ul class="hero-points">
        <li>근로 · 주택임대차 · 금전차용 계약 검토</li>
        <li>개인정보는 가린 뒤 분석해요</li>
        <li>업로드 원본은 24시간 뒤 자동 삭제돼요</li>
      </ul>
    </aside>
    <main class="form-pane">
      <div class="form-links-top">
        <a href="/">← 홈으로</a>
        <a href="/?sample=1" id="sampleLink">샘플 리포트 먼저 보기</a>
      </div>
      <div class="card">
        <div class="tabs" role="tablist" aria-label="로그인 또는 가입">
          <button type="button" id="tabLogin" class="on" role="tab" aria-selected="true">로그인</button>
          <button type="button" id="tabSignup" role="tab" aria-selected="false">가입</button>
        </div>
        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="loginId">아이디</label>
            <div class="control">
              <input id="loginId" name="login_id" autocomplete="username" required />
            </div>
            <div class="field-error" id="loginIdErr" aria-live="polite"></div>
          </div>
          <div class="field">
            <label for="loginPw">비밀번호</label>
            <div class="control">
              <input id="loginPw" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-toggle="#loginPw" aria-label="비밀번호 보기">보기</button>
            </div>
            <div class="field-error" id="loginPwErr" aria-live="polite"></div>
          </div>
          <div class="field-error" id="loginFormErr" aria-live="polite"></div>
          <button class="primary" type="submit">로그인</button>
        </form>
        <form id="signupForm" class="hidden" autocomplete="on">
          <div class="field">
            <label for="signupId">아이디 (영문·숫자 4~20자)</label>
            <div class="control">
              <input id="signupId" name="login_id" required minlength="4" maxlength="20" pattern="[A-Za-z0-9]{4,20}" />
            </div>
            <div class="field-error" id="signupIdErr" aria-live="polite"></div>
          </div>
          <div class="field">
            <label for="signupPw">비밀번호 (8자 이상)</label>
            <div class="control">
              <input id="signupPw" name="password" type="password" required minlength="8" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-toggle="#signupPw" aria-label="비밀번호 보기">보기</button>
            </div>
            <div class="field-error" id="signupPwErr" aria-live="polite"></div>
          </div>
          <div class="field">
            <label for="signupBirth">생년월일</label>
            <div class="control">
              <input id="signupBirth" name="birth_date" type="date" required />
            </div>
            <div class="field-error" id="signupBirthErr" aria-live="polite"></div>
          </div>
          <p class="age-note">만 19세 이상만 가입할 수 있어요.</p>
          <div class="field-error" id="signupFormErr" aria-live="polite"></div>
          <button class="primary" type="submit">가입하기</button>
        </form>
      </div>
      <p class="form-links-bottom">
        <a href="#" id="helpPw">비밀번호 찾기 / 탈퇴</a>
      </p>
    </main>
  </div>
  <script>
    function safeNext(raw) {
      if (!raw || typeof raw !== "string") return "/";
      let path = raw;
      try { path = decodeURIComponent(raw); } catch (_) {}
      if (!path.startsWith("/") || path.startsWith("//") || /^https?:/i.test(path)) return "/";
      return path;
    }
    function nextTarget() {
      const q = new URLSearchParams(location.search).get("next");
      return safeNext(q || "/static/review.html");
    }
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");

    function clearErrors() {
      document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
    }
    function showTab(which) {
      const login = which === "login";
      loginForm.classList.toggle("hidden", !login);
      signupForm.classList.toggle("hidden", login);
      tabLogin.classList.toggle("on", login);
      tabSignup.classList.toggle("on", !login);
      tabLogin.setAttribute("aria-selected", login);
      tabSignup.setAttribute("aria-selected", !login);
      clearErrors();
    }
    tabLogin.onclick = () => showTab("login");
    tabSignup.onclick = () => showTab("signup");

    document.querySelectorAll(".pw-toggle").forEach((btn) => {
      btn.onclick = () => {
        const input = document.querySelector(btn.dataset.toggle);
        if (!input) return;
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "숨기기" : "보기";
      };
    });

    document.getElementById("helpPw").onclick = async (e) => {
      e.preventDefault();
      const r = await fetch("/api/auth/password-help", { method: "POST" });
      const j = await r.json().catch(() => ({}));
      alert(j.message || "관리자에게 문의하세요");
    };

    document.getElementById("sampleLink").onclick = (e) => {
      e.preventDefault();
      location.href = "/?openSample=1";
    };

    function ageOk(birth) {
      if (!birth) return false;
      const d = new Date(birth + "T00:00:00");
      if (Number.isNaN(d.getTime())) return false;
      const now = new Date();
      let age = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age -= 1;
      return age >= 19;
    }

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      clearErrors();
      const fd = new FormData(loginForm);
      const login_id = String(fd.get("login_id") || "").trim();
      const password = String(fd.get("password") || "");
      if (!login_id) {
        document.getElementById("loginIdErr").textContent = "아이디를 입력해주세요.";
        return;
      }
      if (!password) {
        document.getElementById("loginPwErr").textContent = "비밀번호를 입력해주세요.";
        return;
      }
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login_id, password }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        document.getElementById("loginFormErr").textContent = j.error || "아이디 또는 비밀번호가 올바르지 않아요.";
        return;
      }
      location.href = nextTarget();
    };

    signupForm.onsubmit = async (e) => {
      e.preventDefault();
      clearErrors();
      const fd = new FormData(signupForm);
      const login_id = String(fd.get("login_id") || "").trim();
      const password = String(fd.get("password") || "");
      const birth_date = String(fd.get("birth_date") || "");
      if (!/^[A-Za-z0-9]{4,20}$/.test(login_id)) {
        document.getElementById("signupIdErr").textContent = "아이디는 영문·숫자 4~20자여야 해요.";
        return;
      }
      if (password.length < 8) {
        document.getElementById("signupPwErr").textContent = "비밀번호는 8자 이상이어야 해요.";
        return;
      }
      if (!ageOk(birth_date)) {
        document.getElementById("signupBirthErr").textContent = "만 19세 이상만 가입할 수 있어요.";
        return;
      }
      const r = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login_id, password, birth_date }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        document.getElementById("signupFormErr").textContent = j.error || "가입에 실패했어요.";
        return;
      }
      location.href = nextTarget();
    };
  </script>
</body>
</html>
