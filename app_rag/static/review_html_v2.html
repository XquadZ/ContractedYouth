<!doctype html><html lang="ko"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계약 검토 워크스페이스 · (계)약한청년들</title><link rel="stylesheet" href="/static/review.css?v=mvp1"><link rel="stylesheet" href="/static/review-workspace.css?v=mvp2"></head><body>
<header class="top"><a href="/" class="brand"><img src="/static/icons/icon-192.png" alt=""><b><span>(계)</span>약한청년들</b></a><span class="crumb">계약서 검토 <i>/</i> 검토 워크스페이스</span><button id="close">나가기 ↗</button></header>
<div class="layout"><aside class="sidebar"><span class="eyebrow">WORKSPACE</span><h2>내 계약서</h2><div id="sampleList"></div><div id="reviewHistorySection" class="review-history-section"><div class="uploaded-list-label">내 검토 기록</div><div id="reviewHistoryList" class="review-history-list"><p class="side-note">아직 검토한 계약서가 없어요</p></div></div><label class="upload">＋ 내 계약서 열기 (PDF·HWP·HWPX·TXT)<input type="file" id="upload" accept=".pdf,.hwp,.hwpx,.txt,application/pdf,text/plain" hidden></label><button type="button" class="paste-btn" id="pasteBtn">텍스트 붙여넣기</button><p class="side-note">업로드 원본은 암호화해 보관하고 24시간 뒤 자동 삭제돼요. 검토 기록은 로그인하면 다시 볼 수 있어요.</p></aside>
<main><section class="workspace-head"><div><div class="eyebrow-row"><div class="eyebrow">CONTRACT REVIEW</div><span id="sampleBadge" class="sample-badge" hidden>예시 화면</span><span id="userBadge" class="user-badge" hidden>내 파일</span></div><h1 id="contractTitle"></h1><p id="contractDesc"></p><div id="domainBanner" class="domain-banner" hidden></div><div id="analyzeProgress" class="analyze-progress" hidden></div></div><button id="export" class="primary">리포트 저장 ↓</button></section>

<div class="workspace"><section class="chat-pane" aria-label="AI 계약서 채팅"><div class="chat-heading"><div><span class="chat-spark">✧</span><b>AI 에이전트</b></div><button id="chatReset" aria-label="현재 계약서 대화 초기화" title="대화 초기화">↻</button></div><div class="chat-context"><span class="chat-context-dot"></span><span id="chatContract"></span></div><div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="계약서 대화 내용"></div><div class="chat-composer"><p id="chatBusyNote" class="chat-guide-note" hidden>분석 중에는 답변이 늦을 수 있어요</p><p id="chatGuideNote" class="chat-guide-note" hidden>AI 답변 · 법률 자문이 아니에요</p><div class="chat-prompts"><button data-chat-prompt="필수 조항에서 빠진 내용을 알려줘">필수 조항 확인</button><button data-chat-prompt="위험 조항을 정리해줘">위험 조항 검토</button></div><form id="chatForm"><label class="sr-only" for="chatInput">계약서에 관해 질문하기</label><textarea id="chatInput" rows="3" maxlength="1500" placeholder="계약서에서 확인할 내용을 질문해보세요."></textarea><div class="chat-form-bottom"><label class="chat-attach" for="upload">＋ 파일 첨부</label><button type="submit" id="chatSend" aria-label="메시지 보내기">➤</button></div></form></div></section><section class="document-pane"><div class="pane-heading"><div><span class="dot"></span><b>원본 계약서</b><small id="pageCount"></small></div><a id="pdfLink" target="_blank" rel="noopener">PDF 원본 열기 ↗</a></div><div class="viewer-toolbar"><div><button id="prev" aria-label="이전 페이지">‹</button><span id="pageNumber"></span><button id="next" aria-label="다음 페이지">›</button></div><span id="jumpNotice" role="status"></span><div><button id="zoomOut" aria-label="축소">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="확대">＋</button></div></div><div class="highlight-legend" id="highlightLegend" aria-label="하이라이트 색상 기준"><span><i class="high"></i>빨강 · 우선 확인</span><span><i class="check"></i>노랑 · 확인 필요</span><span><i class="info"></i>초록 · 참고</span></div><div class="page-stage" id="pageStage"><div class="page-canvas" id="pageCanvas"><img id="pageImage" alt="원본 계약서 페이지"><div class="highlight-layer" id="highlightLayer"></div></div><iframe id="customPdf" title="선택한 PDF 원본" hidden></iframe><div id="textStage" class="text-stage" hidden></div></div><div class="page-strip" id="pageStrip"></div></section>
<section class="analysis-pane"><div class="pane-heading"><div><span class="spark">✧</span><b>계약 검토 결과</b></div></div><nav class="report-tabs" aria-label="리포트 항목"><button data-tab="overview" class="active">요약</button><button data-tab="complete">필수 조항</button><button data-tab="risks">위험 조항</button><button data-tab="questions">확인 질문</button></nav><div class="report-body" id="reportBody"></div></section></div>
</main></div>
<dialog id="pasteDialog" class="paste-dialog"><form method="dialog" id="pasteForm"><h3>계약서 텍스트 붙여넣기</h3><textarea id="pasteText" rows="12" placeholder="계약서 본문을 붙여넣으세요."></textarea><div class="paste-actions"><button type="button" id="pasteCancel" value="cancel">취소</button><button type="submit" id="pasteSubmit" value="ok" class="primary">분석하기</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div><script src="/static/review-data.js?v=mvp1"></script><script src="/static/review.js?v=mvp2"></script><script src="/static/review-chat.js?v=mvp3"></script><script src="/static/review-auth.js?v=mvp2"></script></body></html>
